name: Deploy to Vercel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          echo "✅ Dependencies installed"
      
      - name: List installed packages
        run: npm list --depth=0 || true
      
      - name: Verify project structure
        run: |
          echo "Checking files..."
          ls -la
          test -f server/index.js && echo "✅ server/index.js exists" || echo "❌ server/index.js missing"
          test -f client/index.html && echo "✅ client/index.html exists" || echo "❌ client/index.html missing"
          test -f client/js/app.js && echo "✅ client/js/app.js exists" || echo "❌ client/js/app.js missing"
      
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        continue-on-error: false